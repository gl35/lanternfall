<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3c79a">
<title>Lanternfall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3c79a; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #lvl { position: absolute; left: calc(18px + env(safe-area-inset-left)); top: calc(14px + env(safe-area-inset-top));
         font-size: 34px; font-weight: 700; text-shadow: 0 2px 10px rgba(90,50,20,.45); }
  #hero { top: calc(68px + env(safe-area-inset-top)) !important; }
  #restart, #hero { position: absolute; right: calc(14px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top));
         width: 46px; height: 46px; border-radius: 50%; border: 0; pointer-events: auto; cursor: pointer;
         background: rgba(255,255,255,.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #restart svg, #hero svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #count { position: absolute; left: 0; right: 0; top: calc(16px + env(safe-area-inset-top)); display: flex; justify-content: center;
         align-items: center; gap: 8px; font-size: 26px; font-weight: 700; text-shadow: 0 2px 10px rgba(90,50,20,.45); }
  #count i { width: 20px; height: 24px; border-radius: 45%; background: radial-gradient(circle at 40% 35%, #fff3c4, #ffb23a);
         box-shadow: 0 0 14px #ffc45a; }
  #beacons { position: absolute; left: 0; right: 0; top: calc(54px + env(safe-area-inset-top)); display: flex; justify-content: center; gap: 7px; }
  #beacons i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); box-sizing: border-box; }
  #beacons i.on { border-color: #ffd070; background: #ffb23a; box-shadow: 0 0 9px #ffc45a; }
  #joy { position: absolute; left: 24%; bottom: calc(15% + env(safe-area-inset-bottom)); width: 112px; height: 112px; margin: -56px 0 0 -56px;
         border-radius: 50%; border: 3px solid rgba(255,255,255,.45); background: rgba(255,255,255,.10); opacity: .55; transition: opacity .2s; }
  #joy.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
         background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(80,40,10,.35); }
  @media (hover: hover) and (pointer: fine) { #joy { display: none; } }
  #hint { position: absolute; left: 74%; bottom: 34%; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%;
         border: 3px solid rgba(255,255,255,.9); background: rgba(255,255,255,.25); animation: pull 1.6s ease-in-out infinite; }
  #hint.off { display: none; }
  @keyframes pull { 0% { transform: translateY(0) scale(1); opacity: 0; } 15% { opacity: 1; }
                    70% { transform: translateY(120px) scale(.85); opacity: 1; } 100% { transform: translateY(120px) scale(.85); opacity: 0; } }
  #fade { position: fixed; inset: 0; background: #fff3e0; opacity: 0; pointer-events: none; transition: opacity .45s; }
  #fade.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="lvl">1</div>
  <button id="restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  <div id="hint"></div>
  <div id="count"><i></i><span id="left"></span></div>
  <div id="beacons"></div>
  <div id="joy"><div id="knob"></div></div>
</div>
<div id="fade"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
