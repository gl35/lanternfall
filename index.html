<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3c79a">
<title>Lanternfall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3c79a; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #lvl { position: absolute; left: calc(18px + env(safe-area-inset-left)); top: calc(14px + env(safe-area-inset-top));
         font-size: 34px; font-weight: 700; text-shadow: 0 2px 10px rgba(90,50,20,.45); }
  #restart { position: absolute; right: calc(14px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top));
         width: 46px; height: 46px; border-radius: 50%; border: 0; pointer-events: auto; cursor: pointer;
         background: rgba(255,255,255,.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #restart svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #shots { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom));
         display: flex; justify-content: center; gap: 10px; }
  #shots i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9a6b, #c8321e);
         box-shadow: 0 2px 6px rgba(80,30,10,.4); transition: transform .25s, opacity .25s; }
  #shots i.used { opacity: .25; transform: scale(.6); }
  #hint { position: absolute; left: 50%; bottom: 30%; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%;
         border: 3px solid rgba(255,255,255,.9); background: rgba(255,255,255,.25); animation: pull 1.6s ease-in-out infinite; }
  #hint.off { display: none; }
  @keyframes pull { 0% { transform: translateY(0) scale(1); opacity: 0; } 15% { opacity: 1; }
                    70% { transform: translateY(120px) scale(.85); opacity: 1; } 100% { transform: translateY(120px) scale(.85); opacity: 0; } }
  #fade { position: fixed; inset: 0; background: #fff3e0; opacity: 0; pointer-events: none; transition: opacity .45s; }
  #fade.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="lvl">1</div>
  <button id="restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  <div id="hint"></div>
  <div id="shots"></div>
</div>
<div id="fade"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
